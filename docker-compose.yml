services:
  db:
    image: postgis/postgis:16-3.4
    container_name: groundcontrol_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-groundcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundcontrol_secret}
      POSTGRES_DB: ${POSTGRES_DB:-groundcontrol}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: groundcontrol_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-groundcontrol}:${POSTGRES_PASSWORD:-groundcontrol_secret}@db:5432/${POSTGRES_DB:-groundcontrol}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: groundcontrol_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
